<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="35" height="38" viewBox="0 0 55 58">
  <style><![CDATA[
    .asset {
      transform-box: fill-box;
      transform-origin: 82% 18%;
      animation: confettiStreamerBig 2.1s ease-in-out 0.08s infinite;
      will-change: transform;
    }
    @keyframes confettiStreamerBig {
      0%,100% { transform: rotate(-10deg) translateY(0px); }
      34% { transform: rotate(10deg) translateY(0.8px); }
      62% { transform: rotate(-3deg) translateY(-0.2px); }
    }
  ]]></style>
  <g transform="translate(10 10)">
    <g class="asset">
      <image x="0" y="0" width="35" height="38" href="data:image/png;base64," xlink:href="data:image/png;base64,"/>
    </g>
  </g>
</svg>