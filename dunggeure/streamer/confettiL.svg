<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="25" height="27" viewBox="0 0 41 43">
  <style><![CDATA[
    .asset {
      transform-box: fill-box;
      transform-origin: 20% 20%;
      animation: confettiStreamerSmall 1.9s ease-in-out 0s infinite;
      will-change: transform;
    }
    @keyframes confettiStreamerSmall {
      0%,100% { transform: rotate(-12deg) translateY(0px); }
      30% { transform: rotate(9deg) translateY(0.7px); }
      60% { transform: rotate(14deg) translateY(-0.4px); }
    }
  ]]></style>
  <g transform="translate(8 8)">
    <g class="asset">
      <image x="0" y="0" width="25" height="27" href="data:image/png;base64," xlink:href="data:image/png;base64,"/>
    </g>
  </g>
</svg>