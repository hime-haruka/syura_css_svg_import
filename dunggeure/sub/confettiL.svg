<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="25" height="27" viewBox="0 0 39 41">
  <style><![CDATA[
    .asset {
      transform-box: fill-box;
      transform-origin: 20% 20%;
      animation: confettiSubSmall 2.5s ease-in-out 0.05s infinite;
      will-change: transform;
    }
    @keyframes confettiSubSmall {
      0%,100% { transform: rotate(-10deg) translateY(0px); }
      35% { transform: rotate(6deg) translateY(0.7px); }
      70% { transform: rotate(12deg) translateY(-0.3px); }
    }
  ]]></style>
  <g transform="translate(7 7)">
    <g class="asset">
      <image x="0" y="0" width="25" height="27" href="data:image/png;base64," xlink:href="data:image/png;base64,"/>
    </g>
  </g>
</svg>