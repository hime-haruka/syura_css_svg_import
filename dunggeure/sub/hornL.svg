<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="24" height="28" viewBox="0 0 38 42">
  <style><![CDATA[
    .asset {
      transform-box: fill-box;
      transform-origin: 54% 90%;
      animation: hornSubL 3.2s cubic-bezier(.46,.04,.54,.96) 0s infinite;
      will-change: transform;
    }
    @keyframes hornSubL {
      0%,100% { transform: rotate(-4deg) translateY(0px); }
      18% { transform: rotate(0deg) translateY(-0.15px); }
      42% { transform: rotate(7deg) translateY(-0.7px); }
      66% { transform: rotate(1deg) translateY(-0.1px); }
      84% { transform: rotate(5deg) translateY(-0.25px); }
    }
  ]]></style>
  <g transform="translate(7 7)">
    <g class="asset">
      <image x="0" y="0" width="24" height="28" href="data:image/png;base64," xlink:href="data:image/png;base64,"/>
    </g>
  </g>
</svg>