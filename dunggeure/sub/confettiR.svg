<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="35" height="38" viewBox="0 0 53 56">
  <style><![CDATA[
    .asset {
      transform-box: fill-box;
      transform-origin: 80% 20%;
      animation: confettiSubBig 2.9s ease-in-out 0.1s infinite;
      will-change: transform;
    }
    @keyframes confettiSubBig {
      0%,100% { transform: rotate(-8deg) translateY(0px); }
      38% { transform: rotate(7deg) translateY(0.8px); }
      72% { transform: rotate(-2deg) translateY(-0.2px); }
    }
  ]]></style>
  <g transform="translate(9 9)">
    <g class="asset">
      <image x="0" y="0" width="35" height="38" href="data:image/png;base64," xlink:href="data:image/png;base64,"/>
    </g>
  </g>
</svg>