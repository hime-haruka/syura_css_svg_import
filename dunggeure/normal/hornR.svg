<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="24" height="28" viewBox="0 0 36 40">
  <style><![CDATA[
    .asset {
      transform-box: fill-box;
      transform-origin: 46% 90%;
      animation: hornNormalR 4.3s ease-in-out 0.2s infinite;
      will-change: transform;
    }
    @keyframes hornNormalR {
      0%,100% { transform: rotate(3deg) translateY(0px); }
      28% { transform: rotate(-1deg) translateY(-0.2px); }
      52% { transform: rotate(-5deg) translateY(-0.5px); }
      76% { transform: rotate(0deg) translateY(-0.1px); }
    }
  ]]></style>
  <g transform="translate(6 6)">
    <g class="asset">
      <image x="0" y="0" width="24" height="28" href="data:image/png;base64," xlink:href="data:image/png;base64,"/>
    </g>
  </g>
</svg>