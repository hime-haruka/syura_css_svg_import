<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="24" height="24" viewBox="0 0 32 32">
  <style><![CDATA[
    .asset {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: buttonNormalL 10s linear 0s infinite;
      will-change: transform;
    }
    @keyframes buttonNormalL {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }
  ]]></style>
  <g transform="translate(4 4)">
    <g class="asset">
      <image x="0" y="0" width="24" height="24" href="data:image/png;base64," xlink:href="data:image/png;base64,"/>
    </g>
  </g>
</svg>