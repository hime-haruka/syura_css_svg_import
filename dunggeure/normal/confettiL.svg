<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="25" height="27" viewBox="0 0 37 39">
  <style><![CDATA[
    .asset {
      transform-box: fill-box;
      transform-origin: 20% 20%;
      animation: confettiNormalSmall 3.8s ease-in-out 0.1s infinite;
      will-change: transform;
    }
    @keyframes confettiNormalSmall {
      0%,100% { transform: rotate(-8deg) translateY(0px); }
      50% { transform: rotate(8deg) translateY(0.8px); }
    }
  ]]></style>
  <g transform="translate(6 6)">
    <g class="asset">
      <image x="0" y="0" width="25" height="27" href="data:image/png;base64," xlink:href="data:image/png;base64,"/>
    </g>
  </g>
</svg>