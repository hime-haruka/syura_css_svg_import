<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="35" height="38" viewBox="0 0 51 54">
  <style><![CDATA[
    .asset {
      transform-box: fill-box;
      transform-origin: 80% 20%;
      animation: confettiNormalBig 4.4s ease-in-out 0s infinite;
      will-change: transform;
    }
    @keyframes confettiNormalBig {
      0%,100% { transform: rotate(-6deg) translateY(0px); }
      50% { transform: rotate(5deg) translateY(1px); }
    }
  ]]></style>
  <g transform="translate(8 8)">
    <g class="asset">
      <image x="0" y="0" width="35" height="38" href="data:image/png;base64," xlink:href="data:image/png;base64,"/>
    </g>
  </g>
</svg>