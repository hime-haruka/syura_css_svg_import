<svg xmlns="http://www.w3.org/2000/svg" width="56" height="48" viewBox="0 0 56 48" fill="none" role="img" aria-label="animated tilted heart" style="overflow: visible;">
  <defs>
    <style>
      .heart-wrap {
        transform-box: fill-box;
        transform-origin: center;
        animation: floaty 2.4s ease-in-out infinite;
      }
      .heart-core {
        transform-box: fill-box;
        transform-origin: center;
        animation: pulse 1.55s ease-in-out infinite;
      }
      .sparkle {
        transform-box: fill-box;
        transform-origin: center;
        animation: twinkle 1.8s ease-in-out infinite;
      }
      @keyframes floaty {
        0%, 100% { transform: rotate(-14deg) translateY(0px); }
        50% { transform: rotate(-11deg) translateY(-1.4px); }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        25% { transform: scale(1.04); }
        45% { transform: scale(0.987); }
        65% { transform: scale(1.028); }
      }
      @keyframes twinkle {
        0%, 100% { opacity: .18; transform: scale(.92); }
        50% { opacity: .48; transform: scale(1.12); }
      }
    </style>
  </defs>

  <g class="heart-wrap">
    <g class="heart-core" transform="translate(5.9 5.8)">
      <path d="M 22.1 34.7 C 18.6 31.8 11.9 26.2 7.0 21.0 C 2.9 16.8 2.4 10.2 6.4 6.1 C 9.7 2.7 15.0 2.3 19.2 5.2 C 20.4 6.1 21.4 7.1 22.1 8.1 C 22.8 7.1 23.8 6.1 25.0 5.2 C 29.2 2.3 34.5 2.7 37.8 6.1 C 41.8 10.2 41.3 16.8 37.2 21.0 C 32.3 26.2 25.6 31.8 22.1 34.7 Z" fill="#92909c"/>
      <g transform="">
        <path d="M 14.5 10.8 C 16.5 8.7 19.6 8.6 21.3 10.1 C 21.8 10.6 21.8 11.4 21.1 11.6 C 19.4 12.1 16.9 12.2 14.8 12.0 C 13.8 11.9 13.8 11.5 14.5 10.8 Z" fill="#ffffff" fill-opacity="0.14"/>
      </g>
    </g>

    <g class="sparkle" opacity="0.22" transform="translate(40.0 10.0)">
      <path d="M0 0 L0.8 1.9 L2.7 2.7 L0.8 3.5 L0 5.4 L-0.8 3.5 L-2.7 2.7 L-0.8 1.9 Z" fill="#ffffff"/>
    </g>
  </g>
</svg>
