<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     version="1.1"
     viewBox="230 235 620 620"
     width="620" height="620"
     role="img"
     aria-label="onigiri chomp sequence left tilt">
  <defs>
    <g id="onigiriShape">
      <path d="M454.37,414.16c38.1-65.84,133.16-65.84,171.26,0l47.32,70.77,47.16,81.87c37.97,65.92-9.56,148.24-85.63,148.32l-94.48.1-94.48-.1c-76.07-.08-123.6-82.4-85.63-148.32l47.16-81.87,47.32-70.77Z"
            fill="#ffffff"
            stroke="#000000"
            stroke-width="26"
            stroke-linecap="round"
            stroke-linejoin="round"/>
      <path d="M490.1,541.64h99.81c16.98,0,30.76,13.78,30.76,30.76v142.75h-161.33v-142.75c0-16.98,13.78-30.76,30.76-30.76Z"
            fill="#2b2c30"
            stroke="#000000"
            stroke-width="18"
            stroke-linecap="round"
            stroke-linejoin="round"/>
    </g>

    <mask id="biteMask" maskUnits="userSpaceOnUse" x="230" y="235" width="620" height="620">
      <rect x="230" y="235" width="620" height="620" fill="white"/>

      <!-- 1. 위쪽 한입: 22% 시점부터 유지 -->
      <circle cx="540" cy="350" r="0" fill="black">
        <animate attributeName="r"
                 values="0;0;145;145;145;145;0"
                 keyTimes="0;0.21;0.22;0.70;0.84;0.999;1"
                 calcMode="discrete"
                 dur="4s"
                 repeatCount="indefinite"/>
      </circle>

      <!-- 2. 왼쪽 한입: 46% 시점부터 추가 -->
      <circle cx="395" cy="520" r="0" fill="black">
        <animate attributeName="r"
                 values="0;0;170;170;170;0"
                 keyTimes="0;0.45;0.46;0.84;0.999;1"
                 calcMode="discrete"
                 dur="4s"
                 repeatCount="indefinite"/>
      </circle>

      <!-- 3. 아래쪽 한입: 70% 시점부터 추가. 이때는 그룹 opacity도 0으로 꺼짐 -->
      <circle cx="540" cy="700" r="0" fill="black">
        <animate attributeName="r"
                 values="0;0;300;300;0"
                 keyTimes="0;0.69;0.70;0.999;1"
                 calcMode="discrete"
                 dur="4s"
                 repeatCount="indefinite"/>
      </circle>
    </mask>
  </defs>

  <!-- 먹히는 본체: 0~70% full/top/top+left 상태만 보여주고, 70%부터는 완전히 숨김 -->
  <g transform="rotate(8 540 540)" mask="url(#biteMask)" opacity="1">
    <animate attributeName="opacity"
             values="1;1;0;0;1"
             keyTimes="0;0.699;0.70;0.84;1"
             calcMode="discrete"
             dur="4s"
             repeatCount="indefinite"/>
    <use href="#onigiriShape"/>
  </g>

  <!-- 뿅 재등장: 84%부터 100%까지만 보임 -->
  <g transform="translate(540 540)" opacity="0">
    <animate attributeName="opacity"
             values="0;0;1;1;0"
             keyTimes="0;0.84;0.841;0.999;1"
             calcMode="discrete"
             dur="4s"
             repeatCount="indefinite"/>
    <animateTransform attributeName="transform"
                      type="scale"
                      additive="sum"
                      values="0;0;1.18;0.96;1"
                      keyTimes="0;0.84;0.90;0.96;1"
                      dur="4s"
                      repeatCount="indefinite"/>
    <g transform="rotate(8) translate(-540 -540)">
      <use href="#onigiriShape"/>
    </g>
  </g>
</svg>
