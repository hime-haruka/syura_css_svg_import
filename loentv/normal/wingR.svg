<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="102" height="90"
     viewBox="0 0 102 90"
     preserveAspectRatio="xMidYMid meet"
     overflow="visible">
  <style>
    .wing-flap {
      transform-box: view-box;
      transform-origin: 28.0px 46.0px;
      animation: flap 1.80s cubic-bezier(.42,0,.58,1) infinite;
      will-change: transform;
      image-rendering: auto;
    }
    @keyframes flap {
      0% { transform: rotate(2.0deg); }
      50% { transform: rotate(-8.0deg); }
      100% { transform: rotate(2.0deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .wing-flap { animation: none; }
    }
  </style>
  <image class="wing-flap" x="20" y="20" width="62" height="50"
         preserveAspectRatio="none" href="data:image/png;base64," xlink:href="data:image/png;base64,"/>
</svg>
