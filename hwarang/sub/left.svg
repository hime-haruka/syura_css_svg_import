<?xml version="1.0" encoding="UTF-8"?>
<svg id="cloud-sub-left" xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="-8 -4 102.61 39">
  <defs>
    <path id="cloud-sub-left-shape" d="M82.8,23.37h-31.41v-3.56h29.08c2.11,0,3.81-1.71,3.81-3.81s-1.71-3.81-3.81-3.81h-15.37v-4.56h17.43c2.11,0,3.81-1.71,3.81-3.81s-1.71-3.81-3.81-3.81H28.48c-2.11,0-3.81,1.71-3.81,3.81s1.71,3.81,3.81,3.81h20.85v4.56H3.81c-2.11,0-3.81,1.71-3.81,3.81s1.71,3.81,3.81,3.81h27.7v3.56h-7.83c-2.11,0-3.81,1.71-3.81,3.81s1.71,3.81,3.81,3.81h59.11c2.11,0,3.81-1.71,3.81-3.81s-1.71-3.81-3.81-3.81Z"/>

    <clipPath id="cloud-sub-left-clip">
      <use href="#cloud-sub-left-shape"/>
    </clipPath>

    <style>
      #cloud-sub-left .outer-stroke {
        fill: none;
        stroke: #6f8f47;
        stroke-width: 2;
        stroke-linejoin: round;
        stroke-linecap: round;
        vector-effect: non-scaling-stroke;
      }

      #cloud-sub-left .fill-shape {
        fill: #ceebae;
      }

      #cloud-sub-left .inner-stroke {
        fill: none;
        stroke: #dbf9bb;
        stroke-width: 2;
        stroke-linejoin: round;
        stroke-linecap: round;
        vector-effect: non-scaling-stroke;
      }

      #cloud-sub-left .cloud-drift {
        animation: cloudDriftSubLeft 9.8s cubic-bezier(.4, 0, .6, 1) -3.3s infinite;
        will-change: transform;
      }

      @keyframes cloudDriftSubLeft {
        0% { transform: translateX(-1.3px); }
        30% { transform: translateX(4.2px); }
        66% { transform: translateX(-4.0px); }
        100% { transform: translateX(-1.3px); }
      }
    </style>
  </defs>

  <g class="cloud-drift">
    <use href="#cloud-sub-left-shape" class="outer-stroke"/>
  <use href="#cloud-sub-left-shape" class="fill-shape"/>

  <g clip-path="url(#cloud-sub-left-clip)">
    <use href="#cloud-sub-left-shape" class="inner-stroke"/>
  </g>
  </g>
</svg>