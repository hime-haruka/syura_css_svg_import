<?xml version="1.0" encoding="UTF-8"?>
<svg id="cloud-n-left" xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="-8 -4 102.61 39">
  <defs>
    <path id="cloud-n-left-shape" d="M82.8,23.37h-31.41v-3.56h29.08c2.11,0,3.81-1.71,3.81-3.81s-1.71-3.81-3.81-3.81h-15.37v-4.56h17.43c2.11,0,3.81-1.71,3.81-3.81s-1.71-3.81-3.81-3.81H28.48c-2.11,0-3.81,1.71-3.81,3.81s1.71,3.81,3.81,3.81h20.85v4.56H3.81c-2.11,0-3.81,1.71-3.81,3.81s1.71,3.81,3.81,3.81h27.7v3.56h-7.83c-2.11,0-3.81,1.71-3.81,3.81s1.71,3.81,3.81,3.81h59.11c2.11,0,3.81-1.71,3.81-3.81s-1.71-3.81-3.81-3.81Z"/>

    <clipPath id="cloud-n-left-clip">
      <use href="#cloud-n-left-shape"/>
    </clipPath>

    <style>
      #cloud-n-left .outer-stroke {
        fill: none;
        stroke: #bb9147;
        stroke-width: 2;
        stroke-linejoin: round;
        stroke-linecap: round;
        vector-effect: non-scaling-stroke;
      }

      #cloud-n-left .fill-shape {
        fill: #ffe9aa;
      }

      #cloud-n-left .inner-stroke {
        fill: none;
        stroke: #fff1b2;
        stroke-width: 2;
        stroke-linejoin: round;
        stroke-linecap: round;
        vector-effect: non-scaling-stroke;
      }

      #cloud-n-left .cloud-drift {
        animation: cloudDriftNLeft 11.7s ease-in-out -1.1s infinite;
        will-change: transform;
      }

      @keyframes cloudDriftNLeft {
        0% { transform: translateX(-1.6px); }
        34% { transform: translateX(3.7px); }
        72% { transform: translateX(-3.2px); }
        100% { transform: translateX(-1.6px); }
      }
    </style>
  </defs>

  <g class="cloud-drift">
    <use href="#cloud-n-left-shape" class="outer-stroke"/>
  <use href="#cloud-n-left-shape" class="fill-shape"/>

  <g clip-path="url(#cloud-n-left-clip)">
    <use href="#cloud-n-left-shape" class="inner-stroke"/>
  </g>
  </g>
</svg>