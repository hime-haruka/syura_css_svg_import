<svg xmlns="http://www.w3.org/2000/svg" width="62" height="53" viewBox="0 0 62 53" fill="none" aria-label="fan eyes right-wink">

    <style>
      .open-eye { fill: #6f7684; }
      .closed-eye, .wink-eye { fill: none; stroke: #6f7684; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

      @keyframes hideOpen {
        0%, 82%, 100% { opacity: 1; }
        85%, 94% { opacity: 0; }
      }
      @keyframes showClosed {
        0%, 82%, 100% { opacity: 0; }
        85%, 94% { opacity: 1; }
      }
      @keyframes hideOpenWink {
        0%, 76%, 100% { opacity: 1; }
        80%, 94% { opacity: 0; }
      }
      @keyframes showWink {
        0%, 76%, 100% { opacity: 0; }
        80%, 94% { opacity: 1; }
      }

      .normal-open { animation: hideOpen 4.2s ease-in-out infinite; }
      .normal-closed { animation: showClosed 4.2s ease-in-out infinite; }

      .wink-open { animation: hideOpenWink 3.8s ease-in-out infinite; }
      .wink-closed { animation: showWink 3.8s ease-in-out infinite; }
    </style>
    
  <g id="fan-eyes">
    <circle class="open-eye " cx="18.3" cy="26.0" r="3.15" /> <circle class="open-eye wink-open" cx="43.7" cy="26.0" r="3.15" /> <path class="wink-eye wink-closed" d="M 47.6 22.7 L 43.8 26.0 L 47.6 29.3" />
  </g>
</svg>
